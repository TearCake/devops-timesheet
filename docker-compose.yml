version: "3.8"

services:
  timesheet-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: timesheet-backend:latest
    container_name: timesheet-app
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://timesheet-mysql:3306/timesheet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      timesheet-mysql:
        condition: service_healthy
    networks:
      - timesheet-network

  timesheet-mysql:
    image: mysql:8.4
    container_name: timesheet-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=timesheet_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./timesheet-management/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timesheet-network

networks:
  timesheet-network:
    driver: bridge

volumes:
  mysql-data:
