# ========================================================================
# Automated Timesheet Management Platform - Ansible Inventory (Week 13)
# ========================================================================

[local]
localhost ansible_connection=local

[staging_servers]
# Staging server node (SSH managed)
timesheet-stage ansible_host=127.0.0.1 ansible_port=2222 ansible_user=vagrant

[prod_servers]
# Production server node (SSH managed)
timesheet-prod ansible_host=192.168.1.100 ansible_user=deploy

[timesheet_servers:children]
local
staging_servers
prod_servers

[timesheet_servers:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=dev
