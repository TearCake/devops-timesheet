# ===============================================
# Automated Timesheet Management Platform
# Week 3 skeleton - backend configuration
# ===============================================

spring.application.name=timesheet-backend
server.port=8080

# -----------------------------------------------
# MySQL datasource (localhost:3306)
# Replace the placeholder credentials below with your local MySQL user/password.
# For a real project prefer environment variables, e.g.:
#   spring.datasource.username=${DB_USER}
#   spring.datasource.password=${DB_PASSWORD}
# -----------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/timesheet_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------
# JPA / Hibernate
# update = let Hibernate create/update tables from the entities during early development.
# The tables also exist in database/schema.sql for reference and manual setup.
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
